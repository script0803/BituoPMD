set_frequency:
  name: Set polling interval
  description: Change how often Home Assistant polls one Bituo device.
  fields:
    device_id:
      name: Device IP
      description: The configured IP address of the Bituo device.
      required: true
      example: 192.0.2.10
      selector:
        text:
    frequency:
      name: Polling interval
      description: Polling interval in seconds.
      required: true
      default: 5
      example: 15
      selector:
        number:
          min: 5
          max: 3600
          step: 1
          mode: box
